<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO 技術監測系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：搜尋列 → 總分 → AI 平台 → 修復清單 → 技術問題 → GEO → 競品 → 追蹤；單欄報告式
   風格：復古電玩。淺色＝紅白機（灰白機身、黑框、紅鍵），深色＝街機 CRT（深靛螢幕、投幣黃、掃描線） */
@font-face{font-family:"Cubic 11";src:url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@1.500/fonts/web/Cubic_11.woff2") format("woff2");font-display:swap}
:root{
  --bg:#E4E1D8; --surface:#F7F5EF; --surface2:#ECE9DF; --ink:#1C1B22; --muted:#5C5966; --line:#C9C4B6;
  --frame:#1C1B22; --shadow:#1C1B22; --scan:rgba(28,27,34,.035);
  --accent:#C8322B; --accent-soft:#F6DCD6; --on-accent:#FFFFFF;
  --crit:#C8322B; --crit-soft:#F6DCD6; --warn:#B4620A; --warn-soft:#F8E5C8; --info:#2D5C9A; --info-soft:#DCE6F4; --good:#257A3E; --good-soft:#D6EDD9;
  --comp:#8D8999;
  --p-aio:#2D5C9A; --p-chatgpt:#1F8A63; --p-gemini:#6B48C4; --p-claude:#C25A2E;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-disp:"Cubic 11","DotGothic16","Noto Sans TC",sans-serif;
  --f-mono:"DotGothic16","Cubic 11",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14112B; --surface:#1E1A3D; --surface2:#28234F; --ink:#F3EFD9; --muted:#A9A3C9; --line:#3A3468;
  --frame:#8F86D6; --shadow:#07061A; --scan:rgba(0,0,0,.28);
  --accent:#FFCE3A; --accent-soft:#3A3220; --on-accent:#14112B;
  --crit:#FF5E6C; --crit-soft:#43192A; --warn:#FFA43A; --warn-soft:#41291A; --info:#5FD3F3; --info-soft:#173A4E; --good:#5BE38C; --good-soft:#173D2D;
  --comp:#6E6896; --p-aio:#5FA8FF; --p-chatgpt:#4BE0A6; --p-gemini:#B58CFF; --p-claude:#FF9566; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14112B; --surface:#1E1A3D; --surface2:#28234F; --ink:#F3EFD9; --muted:#A9A3C9; --line:#3A3468;
  --frame:#8F86D6; --shadow:#07061A; --scan:rgba(0,0,0,.28);
  --accent:#FFCE3A; --accent-soft:#3A3220; --on-accent:#14112B;
  --crit:#FF5E6C; --crit-soft:#43192A; --warn:#FFA43A; --warn-soft:#41291A; --info:#5FD3F3; --info-soft:#173A4E; --good:#5BE38C; --good-soft:#173D2D;
  --comp:#6E6896; --p-aio:#5FA8FF; --p-chatgpt:#4BE0A6; --p-gemini:#B58CFF; --p-claude:#FF9566; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:20px 56px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wrap>*,.sec>*,.layer>*{min-width:0}
#report{width:100%}
code{word-break:break-all;overflow-wrap:anywhere}
.empty,.notice,.pcard p{overflow-wrap:anywhere}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-disp);font-weight:900;font-size:22px;line-height:1.3;text-wrap:balance}
h3{font-size:15px;font-weight:700}
a{color:var(--accent);word-break:break-all}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-direction:column;gap:2px}
.sec-head p{color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.grid{display:grid;gap:14px;min-width:0}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media (max-width:420px){.g4{grid-template-columns:1fr}}
.top{display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:900;font-size:20px}
.stamp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--info-soft);color:var(--info);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
input,select{font:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
#url{font-family:var(--f-mono)}
#competitors{flex:1 1 300px;font-family:var(--f-mono)}
button{font:inherit;cursor:pointer}
.btn{padding:11px 22px;border-radius:8px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn:disabled{opacity:.55;cursor:progress}
.btn2{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 14px;font-size:13.5px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.notice{font-size:13.5px;color:var(--muted)}
.notice.err{color:var(--crit)}
.target{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.dom{font-family:var(--f-mono);font-size:15px;font-weight:500}
.hero{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr;justify-items:center}}
.ring{position:relative;width:190px;height:190px}
.ring svg{display:block;width:100%;height:100%}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-family:var(--f-disp);font-weight:900;font-size:54px;line-height:1}
.ring .val span{font-size:13px;color:var(--muted)}
.hero-r{display:flex;flex-direction:column;gap:14px;width:100%}
.verdict{font-family:var(--f-disp);font-weight:900;font-size:20px;line-height:1.45;text-wrap:balance}
.dims{display:flex;flex-direction:column;gap:9px}
.dim{display:grid;grid-template-columns:110px 1fr 80px;gap:10px;align-items:center;font-size:14px}
.t{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.t i{display:block;height:100%;background:var(--accent)}
.t i.low{background:var(--warn)} .t i.vlow{background:var(--crit)}
.dim .n{text-align:right;font-size:13px}
.up{color:var(--good)} .dn{color:var(--crit)}
.tile{display:flex;flex-direction:column;gap:2px}
.tile .l{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--f-disp);font-weight:900;font-size:32px;line-height:1.15}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.c .v{color:var(--crit)} .tile.w .v{color:var(--warn)} .tile.i .v{color:var(--info)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right}
td.wide{min-width:240px}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
details ul{margin:6px 0 0;padding-left:1.1em;font-size:12.5px;color:var(--muted);font-family:var(--f-mono);word-break:break-all}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.geo-item{display:flex;flex-direction:column;gap:8px}
.geo-item .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.geo-item p{color:var(--muted);font-size:14px}
.fix{font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.fix b{color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.brow .nm{font-size:14px;font-weight:500}
.bset{display:flex;flex-direction:column;gap:4px}
.bl{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center;font-size:12.5px}
.bl .t{height:9px;border:0}
.bl .t i{background:var(--comp)}
.bl.me .t i{background:var(--accent)}
.bl .n{text-align:right;color:var(--muted)}
.bl.me .n{color:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:520px){.brow{grid-template-columns:1fr;gap:4px}}
.gap-neg{color:var(--crit)} .gap-pos{color:var(--good)}
svg.lc{display:block;width:100%;height:auto}
svg.lc text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
svg.lc .gl{stroke:var(--line);stroke-width:1}
.empty{border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted);font-size:14px;background:var(--surface)}
.empty b{color:var(--ink)}
.pevals{display:flex;flex-direction:column;gap:12px}
.peval{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.peval .scores{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.peval .rew{grid-column:1/-1;font-size:14px;background:var(--surface2);border-radius:8px;padding:10px 12px}
.peval ul{grid-column:1/-1;margin:0;padding-left:1.2em;font-size:14px;color:var(--muted)}
@media (max-width:600px){.peval{grid-template-columns:1fr}}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.road{grid-template-columns:1fr}}
.road .panel{display:flex;flex-direction:column;gap:10px}
.road ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.when{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
#report[hidden]{display:none}
.pcards{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:14px}
@media (max-width:1050px){.pcards{grid-template-columns:repeat(2,1fr)}}
.kv>span:first-child{white-space:nowrap}
@media (max-width:520px){.pcards{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc,var(--accent));border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.pcard h3{display:flex;align-items:center;gap:8px;font-size:17px}
.pcard h3 i{width:10px;height:10px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:14px}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.pcard .lead{text-align:right;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.d{font-size:12px;font-family:var(--f-mono);padding:1px 8px;border-radius:99px;white-space:nowrap;justify-self:start}
.d.up{background:var(--good-soft);color:var(--good)} .d.dn{background:var(--crit-soft);color:var(--crit)} .d.eq{background:var(--surface2);color:var(--muted)}
.layer{display:flex;flex-direction:column;gap:10px}
.layer-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbadge{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:3px 10px;border-radius:6px;background:var(--accent);color:var(--on-accent)}
.layer-hd h3{font-size:16px;flex:1;min-width:200px}
.lstats{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.lstats b{color:var(--ink);font-family:var(--f-mono)}
.qrow{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.qrow .q{font-weight:500;font-size:14.5px}
.qrow .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){.qrow{grid-template-columns:1fr}.qrow .tags{justify-content:flex-start}}
.chip.cite{background:var(--accent-soft);color:var(--accent)}
.lvl{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lvl.urgent{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.setup{display:flex;flex-direction:column;gap:12px}
.setup .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media print{
  body{background:#fff;padding-block:0}
  .noprint{display:none!important}
  .panel,.geo-item,tr,.peval{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ── 復古電玩外觀 ── */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,var(--scan) 0 2px,transparent 2px 4px)}
h2{font-family:var(--f-disp);font-weight:400;font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:12px;height:12px;flex:none;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%)}
h3{font-family:var(--f-disp);font-weight:400;font-size:16.5px;letter-spacing:.03em}
.brand{font-family:var(--f-disp);font-weight:400;font-size:22px;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.brand::after{content:"PLAYER 1";font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;padding:2px 8px;border:2px solid var(--frame);color:var(--accent);background:var(--surface)}
.panel,.pcard,.qrow,.empty{border-radius:0;border:3px solid var(--frame);box-shadow:5px 5px 0 var(--shadow)}
.empty{border-style:dashed;box-shadow:none}
.pcard{border-top:8px solid var(--pc,var(--accent))}
.qrow{border-width:2px;box-shadow:3px 3px 0 var(--shadow)}
input,select{border-radius:0;border:3px solid var(--frame);font-family:var(--f-mono);font-size:15px}
input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn,.btn2,.filters button{font-family:var(--f-disp);font-weight:400;letter-spacing:.06em;border-radius:0;border:3px solid var(--frame);box-shadow:4px 4px 0 var(--shadow);transition:transform .05s,box-shadow .05s}
.btn{background:var(--accent);color:var(--on-accent);font-size:16.5px}
.btn2{background:var(--surface);font-size:13.5px}
.filters button{border-width:2px;box-shadow:3px 3px 0 var(--shadow)}
.btn:active:not(:disabled),.btn2:active:not(:disabled),.filters button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.chip,.lvl,.d,.lbadge{border-radius:0;font-family:var(--f-mono);letter-spacing:.02em;border:2px solid currentColor}
.d{padding:0 6px}
.lbadge{border-color:var(--frame);font-family:var(--f-disp);font-weight:400}
.t,.bar{height:16px;border-radius:0;border:2px solid var(--frame);background:var(--surface2);padding:2px}
.t i,.bar i{-webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 11px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 11px)}
.bl .t{height:14px;border-width:2px}
.ring .val b{font-family:var(--f-disp);font-weight:400;font-size:55px}
.ring .val span{font-family:var(--f-mono)}
.tile .v{font-family:var(--f-disp);font-weight:400;font-size:33px}
.tile .l,th,.when,.sitebar label{font-family:var(--f-mono);letter-spacing:.06em}
.verdict{font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1.5}
th{border-bottom:3px solid var(--frame);color:var(--ink)}
td{border-bottom:2px dashed var(--line)}
details summary{font-family:var(--f-mono)}
.layer-hd h3{font-size:16.5px}
.notice{font-family:var(--f-mono);font-size:14px}
#ptext::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#ptext::after{animation:none}.btn,.btn2{transition:none}}
@media print{body::after{display:none}.panel,.pcard,.qrow{box-shadow:none}}

/* ── 三段式畫面：開始 → 載入 → 報告 ── */
.screen{min-height:min(82vh,760px);display:grid;place-items:center;position:relative;padding-block:24px}
.screen-tools{position:absolute;top:0;right:0}
.title-card,.load-card{width:min(640px,100%);display:flex;flex-direction:column;gap:16px;padding:32px 28px}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.18em;color:var(--accent)}
.title{font-family:var(--f-disp);font-weight:400;font-size:44px;line-height:1.2;letter-spacing:.04em;text-wrap:balance;text-shadow:4px 4px 0 var(--accent-soft)}
.lead{color:var(--muted);font-size:15.5px}
#sform{display:flex;flex-direction:column;gap:10px}
.lbl{font-family:var(--f-disp);font-size:16.5px;letter-spacing:.04em}
.inrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.inrow input{font-size:17px;padding:14px 16px}
.inrow .btn{padding:0 26px;font-size:19px}
.adv summary{font-family:var(--f-mono);color:var(--muted);cursor:pointer;font-size:13.5px}
.advrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.advrow input{flex:1 1 260px}
.press{font-family:var(--f-disp);text-align:center;letter-spacing:.3em;color:var(--accent);font-size:16.5px;animation:blink 1.2s steps(1) infinite}
.notice[role=alert]:empty{display:none}
.notice.err{color:var(--crit)}
.lhost{font-size:22px;word-break:break-all}
.lhost::before{display:none}
.track{position:relative;padding-top:30px}
.bigbar{height:30px;border:3px solid var(--frame);background:var(--surface2);padding:3px}
.bigbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s steps(6);-webkit-mask:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 16px);mask:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 16px)}
.runner{position:absolute;top:0;left:0;width:3px;height:3px;transform:translateX(-50%);transition:left .4s steps(6);animation:hop .5s steps(2) infinite}
@keyframes hop{50%{margin-top:-3px}}
.lmeta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.lmeta b{color:var(--ink);font-family:var(--f-disp);font-weight:400;font-size:22px}
#ldetail{flex:1;text-align:center}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.stages li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;color:var(--muted)}
.stages li::before{content:"□";font-family:var(--f-mono)}
.stages li.done{color:var(--ink)} .stages li.done::before{content:"■";color:var(--good)}
.stages li.now{color:var(--ink);font-weight:700} .stages li.now::before{content:"▶";color:var(--accent);animation:blink .8s steps(1) infinite}
.tip{border-top:2px dashed var(--line);padding-top:12px;font-size:14px;color:var(--muted);min-height:3.2em}
.tip b{font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.load-card.done .eyebrow{color:var(--good)}
@media (max-width:520px){.title{font-size:33px}.inrow{grid-template-columns:1fr}.inrow .btn{padding:12px}.title-card,.load-card{padding:24px 18px}}
@media (prefers-reduced-motion:no-preference){
  #report.reveal>*{animation:rise .45s both}
  #report.reveal .t i{animation:grow .9s steps(10) both}
}
@keyframes rise{from{transform:translateY(10px)}}
@keyframes grow{from{width:0}}
@media (prefers-reduced-motion:reduce){.press,.stages li.now::before,.runner{animation:none}.bigbar i,.runner{transition:none}}
@media print{#topbar .btn2,#rnotice{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top noprint-bar" id="topbar" hidden>
  <div class="brandrow">
    <div class="brand">GEO 技術監測系統</div>
    <div class="stamp">
      <span>數據更新時間：<b class="num" id="stamp" style="color:var(--ink)">—</b></span>
      <button class="btn2 noprint" id="restart" type="button">◀ 重新開始</button>
      <button class="btn2 noprint" id="pdfbtn" type="button">下載 PDF</button>
      <button class="btn2 noprint" id="jsonbtn" type="button">下載 JSON</button>
      <button class="btn2 noprint themebtn" type="button">深色／淺色</button>
    </div>
  </div>
  <p class="notice noprint" id="rnotice" role="status"></p>
</header>

<section class="screen" id="start" aria-labelledby="start-title">
  <div class="screen-tools"><button class="btn2 themebtn" type="button">深色／淺色</button></div>
  <div class="title-card panel">
    <p class="eyebrow">GEO MONITOR · AI SEARCH READINESS</p>
    <h1 class="title" id="start-title">GEO 技術監測系統</h1>
    <p class="lead" id="lead">檢查網站的技術 SEO 與 GEO 內容，看看 AI 搜尋會不會引用你。</p>
    <form id="sform" autocomplete="off">
      <label for="url" class="lbl">▶ 輸入網址</label>
      <div class="inrow">
        <input id="url" name="url" type="text" inputmode="url" placeholder="www.your-site.com" required>
        <button class="btn" id="go" type="submit">START</button>
      </div>
      <details class="adv" id="adv">
        <summary>進階設定</summary>
        <div class="advrow">
          <input id="competitors" name="competitors" type="text" placeholder="競品網址（選填，最多 3 個，用逗號分隔）" aria-label="競品網址">
          <select id="maxPages" name="maxPages" aria-label="最多爬取頁數">
            <option value="50">最多 50 頁</option>
            <option value="100" selected>最多 100 頁</option>
            <option value="200">最多 200 頁</option>
            <option value="500">最多 500 頁</option>
          </select>
        </div>
      </details>
    </form>
    <p class="notice" id="notice" role="alert"></p>
    <p class="press" aria-hidden="true">PRESS START</p>
  </div>
</section>

<section class="screen" id="loading" hidden aria-live="polite">
  <div class="load-card panel">
    <p class="eyebrow" id="leyebrow">NOW LOADING</p>
    <h2 class="lhost" id="lhost">—</h2>
    <div class="track"><div class="bigbar"><i id="lbar"></i></div><span class="runner" id="runner" aria-hidden="true"></span></div>
    <div class="lmeta num"><b id="lpct">0%</b><span id="ldetail">準備中</span><span id="ltime">00:00</span></div>
    <ol class="stages" id="stages"></ol>
    <p class="tip" id="ltip"></p>
  </div>
</section>

<main id="report" class="wrap" hidden></main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = (iso) => new Date(iso).toLocaleString("zh-TW", { hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
const fmtDate = (d) => d.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
const SEV = { crit: ["嚴重", "crit"], warn: ["警告", "warn"], info: ["提示", ""] };
const LV = { high: ["高", "crit"], mid: ["中", "warn"], low: ["低", ""] };
const DIMS = [["technical", "技術 SEO"], ["content", "內容結構"], ["schema", "結構化資料"], ["authority", "權威訊號"], ["citeability", "AI 可引用性"]];
const grade = (s) => (s >= 80 ? "良好" : s >= 60 ? "中等" : s >= 40 ? "待加強" : "不佳");
const barCls = (s) => (s < 50 ? "vlow" : s < 65 ? "low" : "");
let current = null;

function renderReport(r) {
  current = r;
  const prev = r.history && r.history.length > 1 ? r.history[r.history.length - 2] : null;
  const delta = (k) => {
    if (!prev) return "";
    const d = r.scores[k] - prev.scores[k];
    return d > 0 ? ` <span class="up">▲${d}</span>` : d < 0 ? ` <span class="dn">▼${-d}</span>` : "";
  };
  const issues = r.issues;
  const tot = (s) => issues.filter((i) => !s || i.severity === s).reduce((n, i) => n + i.count, 0);
  const cnt = (s) => issues.filter((i) => i.severity === s).length;
  const C = 2 * Math.PI * 54;
  const verdict = r.geo.summary || autoVerdict(r);
  const next = new Date(r.finishedAt); next.setMonth(next.getMonth() + 1);

  let h = "";
  h += `<div class="target"><span class="chip acc">檢測對象</span><span class="dom">${esc(r.target.host)}</span>
    <span class="num muted" style="font-size:13px">爬取 ${r.crawl.pagesCrawled} 頁 · sitemap ${r.crawl.sitemapUrls} 筆 · 耗時 ${Math.round(r.durationMs / 1000)} 秒</span>
    ${STATIC || MODE === "public" || (!r.llm.error && !r.llm.used) ? "" : r.llm.used ? `<span class="chip good">Claude 內容評估已啟用</span>` : `<span class="chip warn" title="${esc(r.llm.error)}">Claude 未啟用，內容分數為規則判斷</span>`}</div>`;

  // 總分
  h += `<section class="sec"><div class="sec-head"><h2>整體 GEO 分數</h2><p>綜合技術 SEO、內容結構、結構化資料、權威訊號與 AI 可引用性，滿分 100。</p></div>
  <div class="panel hero">
    <div class="ring" role="img" aria-label="整體 GEO 分數 ${r.scores.overall} 分">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--surface2)" stroke-width="10"/><circle cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="10" stroke-dasharray="${(C * r.scores.overall / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="54" fill="none" stroke="var(--surface)" stroke-width="12" stroke-dasharray="2.4 7.025" transform="rotate(-90 60 60)"/></svg>
      <div class="val"><b class="num">${r.scores.overall}</b><span>/ 100 · ${grade(r.scores.overall)}</span></div>
    </div>
    <div class="hero-r">
      <p class="verdict">${esc(verdict)}</p>
      <div class="dims">${DIMS.map(([k, n]) => `<div class="dim"><span>${n}</span><div class="t"><i class="${barCls(r.scores[k])}" style="width:${r.scores[k]}%"></i></div><span class="n num">${r.scores[k]}${delta(k)}</span></div>`).join("")}</div>
      <p class="muted" style="font-size:13px">${prev ? `較上次（${fmtTime(prev.finishedAt)}）：${delta("overall") || "持平"}，${prev.scores.overall} → ${r.scores.overall}` : "這是第一次檢測，下次檢測後會顯示變化。"}</p>
    </div>
  </div></section>`;

  h += aiSections(r) + prioritySection(r);

  // 技術 SEO
  h += `<section class="sec"><div class="sec-head"><h2>技術 SEO 需改善項目</h2><p>共 ${issues.length} 類問題、${tot()} 處待修。先處理紅色項目，它們會直接影響收錄與 AI 爬蟲存取。</p></div>
  <div class="grid g4">
    <div class="panel tile"><span class="l">待改善項目</span><span class="v num">${issues.length} 類</span><span class="s">合計 ${tot()} 處</span></div>
    <div class="panel tile c"><span class="l">嚴重</span><span class="v num">${tot("crit")}</span><span class="s">${cnt("crit")} 類 · 立即修</span></div>
    <div class="panel tile w"><span class="l">警告</span><span class="v num">${tot("warn")}</span><span class="s">${cnt("warn")} 類 · 30 天內</span></div>
    <div class="panel tile i"><span class="l">提示</span><span class="v num">${tot("info")}</span><span class="s">${cnt("info")} 類 · 排入例行</span></div>
  </div>`;
  if (issues.length) {
    h += `<div class="panel"><div class="filters noprint" role="group" aria-label="依嚴重度篩選" style="margin-bottom:10px">
      <button type="button" data-f="all" aria-pressed="true">全部 ${issues.length}</button><button type="button" data-f="crit" aria-pressed="false">嚴重 ${cnt("crit")}</button><button type="button" data-f="warn" aria-pressed="false">警告 ${cnt("warn")}</button><button type="button" data-f="info" aria-pressed="false">提示 ${cnt("info")}</button></div>
      <div class="tw"><table><thead><tr><th>問題項目</th><th>嚴重度</th><th class="r">數量</th><th>改善建議</th></tr></thead><tbody id="issues">
      ${issues.map((i) => `<tr data-s="${i.severity}"><td class="wide"><b style="font-weight:500">${esc(i.title)}</b>
        ${i.pages.length ? `<details><summary>查看 ${i.pages.length < i.count ? "前 " + i.pages.length + " 筆" : i.pages.length + " 筆"}</summary><ul>${i.pages.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></details>` : ""}</td>
        <td><span class="chip ${SEV[i.severity][1]}">${SEV[i.severity][0]}</span></td><td class="r num">${i.count} ${esc(i.unit)}</td><td class="wide muted">${esc(i.fix)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  } else h += `<div class="empty">沒有發現技術問題。</div>`;
  const perfOk = r.performance.filter((p) => !p.error);
  if (perfOk.length) h += `<div class="panel tw"><h3 style="margin-bottom:6px">行動版速度（PageSpeed Insights）</h3><table><thead><tr><th>頁面</th><th class="r">效能分數</th><th class="r">LCP</th><th class="r">CLS</th></tr></thead><tbody>
    ${perfOk.map((p) => `<tr><td class="wide">${esc(p.url)}</td><td class="r num">${p.score}</td><td class="r num ${p.lcp > 2500 ? "dn" : ""}">${(p.lcp / 1000).toFixed(1)} 秒</td><td class="r num">${p.cls?.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>`;
  else if (r.performance.length) h += `<div class="empty noprint">速度檢測沒有完成：${esc(r.performance[0].error)}。請在 <b>.env</b> 設定 <b>PSI_API_KEY</b>（Google Cloud 免費申請）。</div>`;
  h += `</section>`;

  // GEO 內容
  h += `<section class="sec"><div class="sec-head"><h2>GEO 內容優化項目</h2><p>AI 引擎偏好可以直接摘錄的答案、可驗證的來源與清楚的品牌實體。以下是目前最影響被引用機率的缺口。</p></div>`;
  h += r.geo.items.length ? `<div class="grid g3">${r.geo.items.map((g) => `<div class="panel geo-item"><div class="hd"><h3>${esc(g.title)}</h3><span class="chip ${LV[g.level][1]}">${LV[g.level][0]}</span></div>
      <p>${esc(g.detail)}</p><p class="fix"><b>建議：</b>${esc(g.fix)}</p>
      ${g.pages?.length ? `<details><summary>受影響頁面 ${g.pages.length}</summary><ul>${g.pages.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></details>` : ""}</div>`).join("")}</div>`
    : `<div class="empty">GEO 內容檢查項目都已符合。</div>`;
  const pe = r.geo.pages.filter((p) => !p.error);
  if (pe.length) h += `<div class="panel"><h3 style="margin-bottom:12px">重點頁面 AI 評估（Claude）</h3><div class="pevals">${pe.map((p) => `<div class="peval">
      <div><b style="font-weight:500">${esc(p.title || p.url)}</b><div class="num muted" style="font-size:12.5px;word-break:break-all">${esc(p.url)}</div>
      <div style="font-size:13.5px;margin-top:4px">這頁該回答：${esc(p.mainQuestion)}</div></div>
      <div class="scores"><span class="chip ${p.answerFirst ? "good" : "crit"}">${p.answerFirst ? "首段有答案" : "首段沒答案"}</span><span class="chip">清晰 ${Math.round(p.clarity)}</span><span class="chip">可引用 ${Math.round(p.citeability)}</span><span class="chip">E-E-A-T ${Math.round(p.eeat)}</span></div>
      ${p.issues?.length ? `<ul>${p.issues.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <div class="rew"><b style="color:var(--accent)">建議開頭改寫：</b>${esc(p.rewrite)}</div></div>`).join("")}</div></div>`;
  if (r.geo.recommendations.length) h += `<div class="panel tw"><h3 style="margin-bottom:6px">優先改善建議</h3><table><thead><tr><th>建議</th><th>影響</th><th>說明</th></tr></thead><tbody>
    ${r.geo.recommendations.map((x) => `<tr><td style="font-weight:500;min-width:160px">${esc(x.title)}</td><td><span class="chip ${x.impact === "高" ? "crit" : x.impact === "中" ? "warn" : ""}">${esc(x.impact)}</span></td><td class="wide muted">${esc(x.detail)}</td></tr>`).join("")}</tbody></table></div>`;
  h += `</section>`;

  // 競品
  h += `<section class="sec"><div class="sec-head"><h2>競品分析與 Gap</h2><p>用同一套規則檢測競品網站，比較各面向分數。</p></div>`;
  const comps = r.competitors.filter((c) => !c.error);
  if (comps.length) {
    h += `<div class="panel"><div class="legend" style="margin-bottom:14px"><span><i style="background:var(--accent)"></i>${esc(r.target.host)}</span>${comps.map((c, i) => `<span><i style="background:var(--comp)"></i>${String.fromCharCode(65 + i)}：${esc(c.host)}</span>`).join("")}</div><div class="bars">
      ${[["overall", "整體 GEO 分數"], ...DIMS].map(([k, n]) => `<div class="brow"><div class="nm">${n}</div><div class="bset"><div class="bl me"><div class="t"><i style="width:${r.scores[k]}%"></i></div><span class="n num">${r.scores[k]}</span></div>
        ${comps.map((c) => `<div class="bl"><div class="t"><i style="width:${c.scores[k]}%"></i></div><span class="n num">${c.scores[k]}</span></div>`).join("")}</div></div>`).join("")}</div></div>`;
    h += `<div class="panel tw"><table><thead><tr><th>面向</th><th class="r">本站</th><th class="r">最強競品</th><th class="r">Gap</th></tr></thead><tbody>
      ${DIMS.map(([k, n]) => { const best = comps.reduce((a, c) => (c.scores[k] > a.scores[k] ? c : a)); const g = r.scores[k] - best.scores[k];
        return `<tr><td>${n}</td><td class="r num">${r.scores[k]}</td><td class="r num">${best.scores[k]} <span class="muted" style="font-size:12px">${esc(best.host)}</span></td><td class="r num ${g < 0 ? "gap-neg" : "gap-pos"}">${g > 0 ? "+" : ""}${g}</td></tr>`; }).join("")}</tbody></table></div>`;
  } else h += `<div class="empty">${r.competitors.length ? "競品檢測失敗：" + esc(r.competitors.map((c) => c.host + "（" + c.error + "）").join("、")) : "這次沒有加入競品。在搜尋列下方填入最多 3 個競品網址，重新檢測即可產生比較。"}</div>`;
  h += `</section>`;

  // Prompts
  if (!(STATIC && !r.geo.prompts.length)) {
  h += `<section class="sec"><div class="sec-head"><h2>AI prompts 與建議</h2><p>潛在客戶可能問 AI 的問題，以及要讓 AI 引用本站該怎麼做。</p></div>`;
  h += r.geo.prompts.length ? `<div class="panel tw"><table><thead><tr><th>建議追蹤的 prompt</th><th>意圖</th><th>對應頁面</th><th>建議動作</th><th>狀態</th></tr></thead><tbody>
    ${r.geo.prompts.map((p) => `<tr><td style="min-width:220px;font-weight:500">${esc(p.prompt)}</td><td>${esc(p.intent)}</td><td style="min-width:160px;font-size:13px;word-break:break-all">${esc(p.targetPage)}</td><td class="wide muted">${esc(p.action)}</td><td><span class="chip">${trackedSet(r).has(p.prompt) ? "追蹤中" : "未追蹤"}</span></td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">這個區塊由 Claude 產生，目前 Claude 未啟用（${esc(r.llm.error || "未設定")}）。</div>`;
  h += `</section>`;
  }

  // 追蹤
  const tgt = (v, d) => Math.min(100, v + d);
  h += `<section class="sec"><div class="sec-head"><h2>後續追蹤報告</h2><p>建議每月檢測一次。下次報告日期：<b class="num" style="color:var(--ink)">${fmtDate(next)}</b>。</p></div>`;
  if (r.history && r.history.length > 1) h += `<div class="panel"><h3 style="margin-bottom:6px">整體分數趨勢</h3><div style="overflow-x:auto">${trend(r.history)}</div></div>`;
  h += `<div class="road">
    <div class="panel"><span class="when">第 1–30 天</span><h3>修正與打底</h3><ul>${issues.filter((i) => i.severity === "crit").map((i) => `<li>${esc(i.title)}（${i.count}）</li>`).join("") || "<li>沒有嚴重問題，直接進行警告項目</li>"}${issues.filter((i) => i.severity === "warn").slice(0, 2).map((i) => `<li>${esc(i.title)}（${i.count}）</li>`).join("")}</ul></div>
    <div class="panel"><span class="when">第 31–60 天</span><h3>內容與結構化資料</h3><ul>${r.geo.items.slice(0, 4).map((g) => `<li>${esc(g.title)}</li>`).join("") || "<li>維持內容更新頻率</li>"}</ul></div>
    <div class="panel"><span class="when">第 61–90 天</span><h3>擴大引用</h3><ul><li>為未被引用的 prompts 新增對應內容</li><li>爭取第三方媒體與產業網站引用</li><li>重新檢測並與競品比較</li></ul></div></div>`;
  h += `<div class="panel tw"><table><thead><tr><th>追蹤指標</th><th class="r">目前</th><th class="r">30 天目標</th><th class="r">90 天目標</th></tr></thead><tbody>
    <tr><td>整體 GEO 分數</td><td class="r num">${r.scores.overall}</td><td class="r num">${tgt(r.scores.overall, 5)}</td><td class="r num">${tgt(r.scores.overall, 12)}</td></tr>
    <tr><td>嚴重技術問題</td><td class="r num">${tot("crit")}</td><td class="r num">0</td><td class="r num">0</td></tr>
    <tr><td>技術問題總數</td><td class="r num">${tot()}</td><td class="r num">${Math.round(tot() * 0.5)}</td><td class="r num">${Math.round(tot() * 0.2)}</td></tr>
    <tr><td>結構化資料分數</td><td class="r num">${r.scores.schema}</td><td class="r num">${tgt(r.scores.schema, 10)}</td><td class="r num">${tgt(r.scores.schema, 25)}</td></tr>
  </tbody></table></div></section>`;
  h += `<p class="foot">檢測時間：${fmtTime(r.startedAt)} – ${fmtTime(r.finishedAt)}。爬取上限 ${r.crawl.maxPages} 頁${r.llm.used ? "，內容評估使用 " + esc(r.llm.model) : ""}。</p>`;

  const el = $("#report");
  el.innerHTML = h;
  $("#stamp").textContent = fmtTime(r.finishedAt);
  document.title = `GEO 報告｜${r.target.host}`;
  el.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => trackAction(b.dataset.act)));
  el.querySelectorAll(".filters button").forEach((b) => b.addEventListener("click", () => {
    el.querySelectorAll(".filters button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    el.querySelectorAll("#issues tr").forEach((tr) => (tr.hidden = !(b.dataset.f === "all" || tr.dataset.s === b.dataset.f)));
  }));
}

function autoVerdict(r) {
  const weakest = DIMS.reduce((a, d) => (r.scores[d[0]] < r.scores[a[0]] ? d : a));
  return `整體 ${grade(r.scores.overall)}，最需要加強的是「${weakest[1]}」（${r.scores[weakest[0]]} 分）。`;
}

function trend(hist) {
  const W = 560, H = 200, L = 40, R = 540, T = 16, B = 160;
  const n = hist.length, x = (i) => L + (n === 1 ? 0 : (i * (R - L)) / (n - 1)), y = (v) => B - (v / 100) * (B - T);
  let s = `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="整體分數趨勢">`;
  for (let g = 0; g <= 100; g += 25) s += `<line class="gl" x1="${L}" x2="${R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 8}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
  const pts = hist.map((h, i) => `${x(i).toFixed(1)},${y(h.scores.overall).toFixed(1)}`);
  s += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>`;
  hist.forEach((h, i) => {
    s += `<circle cx="${x(i)}" cy="${y(h.scores.overall)}" r="4" fill="var(--accent)"/><text x="${x(i)}" y="${y(h.scores.overall) - 10}" text-anchor="middle" style="fill:var(--ink)">${h.scores.overall}</text>`;
    if (n <= 8 || i % Math.ceil(n / 8) === 0 || i === n - 1) s += `<text x="${x(i)}" y="${B + 22}" text-anchor="middle">${new Date(h.finishedAt).toLocaleDateString("zh-TW", { month: "numeric", day: "numeric" })}</text>`;
  });
  return s + "</svg>";
}

function trackingSetup(r) {
  if (STATIC || !r.providers) return "";
  const ps = r.promptSet, pv = r.providers || [];
  const on = pv.filter((p) => p.enabled);
  return `<div class="panel setup noprint"><h3>AI 平台追蹤設定</h3>
    <div class="row">${pv.map((p) => `<span class="chip ${p.enabled ? "good" : ""}">${esc(p.name)} ${p.enabled ? "已設定" : "未設定 key"}</span>`).join("")}</div>
    <p class="muted" style="font-size:13.5px">${ps
      ? `追蹤題目：${ps.count} 題，品牌「${esc(ps.brand)}」。要修改題目、品牌別名或競品，請編輯 <code>${esc(ps.file)}</code>。${ps.placeholder ? "<b style='color:var(--warn)'>題目還有範本文字，請先改寫。</b>" : ""}`
      : "還沒有追蹤題目。可以請 Claude 依網站內容產生 30 題，再自行修改。"}</p>
    <div class="row"><button class="btn2" type="button" data-act="prompts">${ps ? "重新產生追蹤題目" : "產生追蹤題目"}</button>
      <button class="btn2" type="button" data-act="track" ${ps && on.length ? "" : "disabled"}>立即執行一輪追蹤</button>
      <span class="muted" style="font-size:13px">${on.length ? `每輪約 ${(ps?.count || 30) * on.length} 次 AI 呼叫` : "請先在 .env 設定至少一個平台的 API key"}</span></div></div>`;
}

const LEVEL = { 緊急: 0, 近期: 1, 觀察: 2 }, EFFORT = { 小: 0, 中: 1, 大: 2 };
function prioritySection(r) {
  const rows = [...(r.priorities || []), ...(r.tracking?.gaps || [])].sort((a, b) => LEVEL[a.level] - LEVEL[b.level] || EFFORT[a.effort] - EFFORT[b.effort]);
  if (!rows.length) return "";
  return `<section class="sec"><div class="sec-head"><h2>優先修復清單</h2><p>依急迫程度與改動量排序。緊急項目建議一週內處理。</p></div>
    <div class="panel tw"><table><thead><tr><th>#</th><th>項目</th><th>級別</th><th>改動量</th><th>對應的 AI 疑慮／缺口</th></tr></thead><tbody>
    ${rows.map((x, i) => `<tr><td class="num muted">${i + 1}</td><td style="min-width:240px">${esc(x.item)}</td><td><span class="lvl ${x.level === "緊急" ? "urgent" : ""}">${esc(x.level)}</span></td><td>${esc(x.effort)}</td><td class="muted" style="min-width:200px">${esc(x.gap || "—")}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}

];
const SLIME = ["...XX...", "..XXXX..", ".XXXXXX.", "XX.XX.XX", "XXXXXXXX", "XXXXXXXX", "X.X..X.X"];
function drawRunner() {
  const px = 3, out = [];
  SLIME.forEach((row, y) => [...row].forEach((c, x) => c === "X" && out.push(`${(x - 3) * px}px ${y * px}px 0 var(--accent)`)));

let loadTimer = null;
function startLoading(host, stages, eyebrow = "NOW LOADING") {
  show("loading");
  $(".load-card").classList.remove("done");
  $("#leyebrow").textContent = eyebrow;
  $("#lhost").textContent = host;
  $("#stages").innerHTML = stages.map((st) => `<li>${esc(st.label)}</li>`).join("");
  const t0 = Date.now();
  let tip = Math.floor(Math.random() * TIPS.length);
  const tick = () => {
    const sec = Math.floor((Date.now() - t0) / 1000);
    $("#ltime").textContent = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    if (sec % 5 === 0) $("#ltip").innerHTML = `<b>TIP</b>${esc(TIPS[tip++ % TIPS.length])}`;
  };
  clearInterval(loadTimer);
  tick();
  loadTimer = setInterval(tick, 1000);
  setLoading(stages, 0, 0, "準備中");
}
function setLoading(stages, idx, frac, detail) {
  const pct = Math.min(100, Math.round(((idx + Math.min(frac, 1)) / stages.length) * 100));
  $("#lbar").style.width = pct + "%";
  $("#runner").style.left = `calc(${pct}% * 0.97 + 1.5%)`;
  $("#lpct").textContent = pct + "%";
  $("#ldetail").textContent = detail;
  [...$("#stages").children].forEach((li, i) => { li.className = i < idx ? "done" : i === idx ? "now" : ""; });
}
async function finishLoading(stages) {
  clearInterval(loadTimer);
  setLoading(stages, stages.length, 0, "完成");
  $(".load-card").classList.add("done");
  $("#leyebrow").textContent = "STAGE CLEAR!";
  await new Promise((ok) => setTimeout(ok, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 700));
}

// 各種工作的關卡，以及伺服器進度訊息對應到哪一關
const SCAN_STAGES = (withComp) => [
  { label: "連線網站", steps: ["開始", "排隊中"] },
  { label: "讀取 robots.txt 與 sitemap", steps: ["讀取 sitemap"] },
  { label: "爬取全站頁面", steps: ["爬取頁面", "重測回應時間"] },
  { label: "測量載入速度", steps: ["測量載入速度"] },
  { label: "AI 內容評估", steps: ["AI 內容評估", "產生總評與建議"] },
  ...(withComp ? [{ label: "分析競品", prefix: "分析競品" }] : []),
  { label: "產生報告", steps: [] },
];
const TRACK_STAGES = [{ label: "準備追蹤題目", steps: ["開始"] }, { label: "詢問各 AI 平台", steps: ["AI 平台追蹤"] }, { label: "統計提及與引用", steps: [] }];
const PROMPT_STAGES = [{ label: "讀取網站資料", steps: ["開始"] }, { label: "Claude 產生追蹤題目", steps: ["Claude 產生追蹤題目"] }, { label: "儲存題目", steps: [] }];
const stageOf = (stages, step) => stages.findIndex((st) => st.steps?.includes(step) || (st.prefix && step?.startsWith(st.prefix)));

// 送出工作並輪詢進度，進度顯示在載入畫面
async function runJob(url, body, host, stages, eyebrow) {
  startLoading(host, stages, eyebrow);
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const { id, error } = await r.json();
  if (!id) throw new Error(error || "無法開始");
  let idx = 0;
  while (true) {
    await new Promise((ok) => setTimeout(ok, 1000));
    const j = await (await fetch(API + "/job?id=" + id)).json();
    if (j.status === "done") { await finishLoading(stages); return j.result; }
    if (j.status === "error" || j.error) throw new Error(j.error || "工作失敗");
    const p = j.progress || {};
    const k = stageOf(stages, p.step);
    if (k > idx) idx = k;
    setLoading(stages, idx, p.total ? p.done / p.total : 0.3, p.detail ? `${p.step}：${p.detail}` : p.total ? `${p.step} ${p.done} / ${p.total}` : p.step || "處理中");
  }
}

function presentReport(r, msg = "") {
  renderReport(r);
  show("report");
  $("#rnotice").textContent = msg;
  const el = $("#report");
  el.classList.remove("reveal");
  void el.offsetWidth;
  el.classList.add("reveal");
  [...el.children].forEach((c, i) => (c.style.animationDelay = Math.min(i, 8) * 70 + "ms"));
  // 總分從 0 數上去
  const num = el.querySelector(".ring .val b");
  if (num && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const target = r.scores.overall, t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 900); num.textContent = Math.round(target * k); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
}

function backToStart(msg = "", isErr = false) {
  clearInterval(loadTimer);
  current = null;
  document.title = "GEO 技術監測系統";
  $("#report").innerHTML = "";
  $("#url").value = "";

}

// 修正常見打錯：中文輸入法的逗號、句號、全形字與空白
const cleanUrl = (v) => v.trim().normalize("NFKC").replace(/[,，。、]/g, ".").replace(/\s+/g, "");
const hostFrom = (v) => cleanUrl(v).replace(/^https?:\/\//i, "").split(/[\/?#]/)[0].toLowerCase();

async function trackAction(act) {
  if (!current) return;
  const keep = current;
  const host = keep.target.host;
  try {
    const info = act === "prompts"
      ? await runJob(API + "/prompts", { host }, host, PROMPT_STAGES, "GENERATING PROMPTS")
      : await runJob(API + "/track", { host }, host, TRACK_STAGES, "ASKING AI PLATFORMS");
    Object.assign(keep, info);
    presentReport(keep, act === "prompts" ? "追蹤題目已產生，請檢查題目後再執行追蹤。" : "追蹤完成，結果已存檔。");
  } catch (err) {
    presentReport(keep, "失敗：" + err.message);
  }
}

let staticIndex = null;
async function openStatic(input) {
  const host = hostFrom(input);
  const stages = [{ label: "尋找報告" }, { label: "讀取檢測資料" }, { label: "繪製報告" }];
  const site = staticIndex?.sites.find((x) => x.host === host || x.host === "www." + host || "www." + x.host === host);
  if (!site) return backToStart(`還沒有 ${host} 的檢測報告。目前可查看：${staticIndex?.sites.map((x) => x.host).join("、") || "無"}。`, true);
  startLoading(site.host, stages, "LOADING REPORT");
  const pause = (ms) => new Promise((ok) => setTimeout(ok, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ms));
  await pause(350);
  setLoading(stages, 1, 0, "下載報告資料");
  const r = await fetch(`data/${encodeURIComponent(site.host)}.json`, { cache: "no-cache" });
  if (!r.ok) return backToStart("報告讀取失敗，請稍後再試。", true);
  const data = await r.json();
  setLoading(stages, 2, 0, "繪製報告");
  await pause(350);
  await finishLoading(stages);
  presentReport(data);
}

    const want = decodeURIComponent(location.hash.slice(1));
    if (want) { history.replaceState(null, "", location.pathname); openStatic(want); }
  }).catch(() => backToStart("報告清單讀取失敗，請重新整理頁面。", true));
}
show("start");
</script>
</body>
</html>
